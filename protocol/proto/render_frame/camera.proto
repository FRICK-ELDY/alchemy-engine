syntax = "proto3";

package alchemy.render;

message CameraParams {
  oneof kind {
    Camera2d camera_2d = 1;
    Camera3d camera_3d = 2;
  }
}

message Camera2d {
  double offset_x = 1;
  double offset_y = 2;
}

message Camera3d {
  repeated double eye = 1;
  repeated double target = 2;
  repeated double up = 3;
  float fov_deg = 4;
  double near = 5;
  double far = 6;
}
